name: springboot-expense-tracker-api-dev

services:
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -N -C -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend-network
    ports:
      - "1433:1433"
    volumes:
      - type: volume
        source: db-data
        target: /var/opt/mssql
    restart: unless-stopped
  db-init:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network
    volumes:
      - type: bind
        source: ./dbinit
        target: /dbinit
    entrypoint:
      - dbinit/entrypoint.sh
      - db
      - ${SPRING_DATASOURCE_USERNAME}
      - ${SPRING_DATASOURCE_PASSWORD}
      - ${DATABASE_NAME}
    restart: "no"
  redis:
    image: redis:latest
    networks:
      - backend-network
    ports:
      - "6379:6379"
    volumes:
      - type: volume
        source: redis-data
        target: /data
    restart: unless-stopped

volumes:
  db-data:
  redis-data:

networks:
  backend-network: