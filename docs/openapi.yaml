openapi: 3.1.0
info:
  title: Expense Tracker API
  description: |
    Simple Expense Tracker RESTful API built with Spring Boot to allow users to create, read, update, and delete expenses.

    [GitHub Repository](https://github.com/krisnaajiep/springboot-expense-tracker-api)
  contact:
    name: Krisna Ajie
    url: https://krisnaajiep.github.io/
    email: krisnaajiep@gmail.com
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
  version: 3.0.0
servers:
- url: http://localhost:8080
  description: ⚠️ Only for local testing
tags:
- name: Auth
  description: User authentication endpoints
- name: Expense
  description: Expense management endpoints
- name: Expense Category
  description: Expense category endpoints
paths:
  /register:
    post:
      tags:
      - Auth
      summary: Register a new user
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request
        "409":
          description: Email already exists
  /login:
    post:
      tags:
        - Auth
      summary: Login user
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: User logged in successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request
        "401":
          description: Invalid credentials
        "429":
          description: Too many login attempts
  /refresh:
    post:
      tags:
      - Auth
      summary: Refresh token
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request
        "401":
          description: Invalid refresh token
  /revoke:
    post:
      tags:
        - Auth
      summary: Revoke all refresh tokens
      operationId: revoke
      responses:
        "200":
          description: Tokens revoked successfully
        "401":
          description: Unauthorized
      security:
        - BearerToken: []
  /expenses:
    post:
      tags:
        - Expense
      summary: Create a new expense
      operationId: save
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseRequest"
        required: true
      responses:
        "201":
          description: Expense created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "404":
          description: Expense category not found
      security:
        - BearerToken: []
    get:
      tags:
      - Expense
      summary: List and filter all expenses
      operationId: findAll
      parameters:
      - name: filter
        in: query
        description: |
          The filter type to apply based on the expense date, Available values are:
          * `PAST_WEEK` - Expenses from the past week.
          * `PAST_MONTH` - Expenses from the past month.
          * `LAST_3_MONTHS` - Expenses from the last 3 months.
        required: false
        schema:
          type: string
          enum:
          - PAST_WEEK
          - PAST_MONTH
          - LAST_3_MONTHS
      - name: from
        in: query
        description: The start date for custom expense filtering in the format `yyyy-MM-dd`
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: The end date for custom expense filtering in the format `yyyy-MM-dd`
        required: false
        schema:
          type: string
          format: date
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: Expenses listed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
      security:
      - BearerToken: []
  /expenses/{expenseId}:
    put:
      tags:
        - Expense
      summary: Update an existing expense
      operationId: update
      parameters:
        - name: expenseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseRequest"
        required: true
      responses:
        "200":
          description: Expense updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Expense or category not found
      security:
        - BearerToken: []
    delete:
      tags:
        - Expense
      summary: Delete an existing expense
      operationId: delete
      parameters:
        - name: expenseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Expense deleted successfully
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Expense not found
      security:
        - BearerToken: []
  /categories:
    get:
      tags:
      - Expense Category
      summary: List all expense categories
      operationId: findAll_1
      responses:
        "200":
          description: Expense categories listed successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseCategoryResponse"
              example:
              - id: 1
                name: Others
              - id: 2
                name: Health
              - id: 3
                name: Clothing
              - id: 4
                name: Utilities
              - id: 5
                name: Electronics
              - id: 6
                name: Leisure
              - id: 7
                name: Groceries
        "401":
          description: Unauthorized
components:
  schemas:
    ExpenseRequest:
      type: object
      description: Expense request body
      properties:
        description:
          type: string
          description: Expense description
          example: Purchase of new computer
          maxLength: 255
          minLength: 1
        amount:
          type: number
          description: Expense amount
          example: 800.0
          minimum: 0.01
        categoryId:
          type: integer
          format: int64
          description: Expense category ID
          example: 1
        date:
          type: string
          format: date
          description: Expense date
          example: 2025-06-30
      required:
      - amount
      - categoryId
      - date
      - description
    ExpenseResponse:
      type: object
      description: Expense response body
      properties:
        id:
          type: string
          format: uuid
          description: Expense ID
          example: fa0f58de-6ed9-4502-9b34-016d614aa5ab
        description:
          type: string
          description: Expense description
          example: Purchase of new computer
        amount:
          type: number
          description: Expense amount
          example: 800.0
        category:
          type: string
          description: Expense category
          example: Electronics
        date:
          type: string
          format: date
          description: Expense date
          example: 2025-06-30
    RegisterRequest:
      type: object
      description: Register request body
      properties:
        name:
          type: string
          description: User name
          example: John Doe
          maxLength: 255
          minLength: 1
          pattern: "^[\\p{L}\\s,.'-]*$"
        email:
          type: string
          description: User email
          example: john@doe.com
          maxLength: 255
          minLength: 1
        password:
          type: string
          description: User password
          example: MyPass_1234
          maxLength: 255
          minLength: 8
          pattern: "^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[@_#\\-$]).*$"
      required:
      - email
      - name
      - password
    TokenResponse:
      type: object
      description: Token response body
      properties:
        access-token:
          type: string
          description: Access token
        refresh-token:
          type: string
          description: Refresh token
    RefreshTokenRequest:
      type: object
      description: Refresh token request body
      properties:
        refresh-token:
          type: string
          description: Refresh token
          minLength: 1
      required:
      - refresh-token
    LoginRequest:
      type: object
      description: Login request body
      properties:
        email:
          type: string
          description: User email
          example: john@doe.com
          minLength: 1
        password:
          type: string
          description: User password
          example: MyPass_1234
          minLength: 1
      required:
      - email
      - password
    PageMetadata:
      type: object
      properties:
        size:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
    PagedResponse:
      type: object
      description: Paged response body
      properties:
        content:
          type: array
          description: List of expenses
          example:
          - id: fa0f58de-6ed9-4502-9b34-016d614aa5ab
            description: Purchase of new computer
            amount: 800.0
            date: 2025-06-30
            category: Electronics
          - id: 8ee69e72-11d2-495c-a9d5-5fe89a095e61
            description: Electricity and internet bill for the office
            amount: 120.0
            date: 2025-07-15
            category: Utilities
          items:
            $ref: "#/components/schemas/ExpenseResponse"
        metadata:
          $ref: "#/components/schemas/PageMetadata"
          description: Page metadata
          example:
            size: 10
            number: 0
            totalElements: 2
            totalPages: 1
    ExpenseCategoryResponse:
      type: object
      description: Expense category response body
      properties:
        id:
          type: integer
          format: int64
          description: Expense category ID
          example: 5
        name:
          type: string
          description: Expense category name
          example: Electronics
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
